<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>퇴근!! - 초화려 네온 축하 페이지</title>

  <!-- Google Fonts: 강렬하고 두꺼운 'Black Han Sans' 및 보조 폰트 'Pretendard / Noto Sans KR' -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. 기본 리셋 및 다크 사이버펑크 우주 배경 설정
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #05020d;
      font-family: 'Noto Sans KR', sans-serif;
      cursor: pointer;
    }

    /* 전체 무대 컨테이너 (클릭 시 화면 흔들림 효과가 적용되는 대상) */
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 50%, rgba(88, 28, 135, 0.45) 0%, rgba(15, 7, 38, 0.85) 55%, #030108 100%);
      overflow: hidden;
      transition: transform 0.05s ease-out;
    }

    /* 화면 흔들림(Screen Shake) 애니메이션 */
    .shake {
      animation: screenShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      15% { transform: translate3d(-10px, -8px, 0) rotate(-1.2deg); }
      30% { transform: translate3d(12px, 6px, 0) rotate(1.4deg); }
      45% { transform: translate3d(-9px, 9px, 0) rotate(-0.9deg); }
      60% { transform: translate3d(8px, -7px, 0) rotate(0.8deg); }
      75% { transform: translate3d(-5px, 4px, 0) rotate(-0.4deg); }
      90% { transform: translate3d(3px, -2px, 0) rotate(0.2deg); }
    }

    /* ==========================================================================
       2. 사이버펑크 바닥 원근 그리드 & 회전하는 후광(Sunburst) 레이어
       ========================================================================== */
    .cyber-grid {
      position: absolute;
      inset: -50%;
      background-image:
        linear-gradient(to right, rgba(255, 0, 204, 0.14) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 242, 254, 0.14) 1px, transparent 1px);
      background-size: 60px 60px;
      transform: perspective(500px) rotateX(60deg) translateY(10%);
      animation: gridMove 4s linear infinite;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 15%, transparent 70%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.9) 15%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 0 60px; }
    }

    /* 회전하는 16갈래 네온 선버스트(광선) */
    .sunburst-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220vmax;
      height: 220vmax;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 2;
      opacity: 0.45;
      mix-blend-mode: screen;
    }

    .sunburst {
      width: 100%;
      height: 100%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 215, 0, 0.25) 0deg 7.5deg,
        transparent 7.5deg 15deg,
        rgba(255, 0, 170, 0.22) 15deg 22.5deg,
        transparent 22.5deg 30deg,
        rgba(0, 240, 255, 0.22) 30deg 37.5deg,
        transparent 37.5deg 45deg
      );
      mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 35%, transparent 65%);
      -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 35%, transparent 65%);
      animation: spinSunburst 24s linear infinite;
    }

    @keyframes spinSunburst {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 중앙 네온 오라 글로우 */
    .center-aura {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(85vw, 760px);
      height: min(45vw, 360px);
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse at center,
        rgba(255, 215, 0, 0.45) 0%,
        rgba(255, 0, 153, 0.35) 40%,
        rgba(0, 229, 255, 0.2) 68%,
        transparent 80%
      );
      filter: blur(42px);
      animation: auraPulse 2.4s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes auraPulse {
      0% { transform: translate(-50%, -50%) scale(0.92); opacity: 0.75; }
      100% { transform: translate(-50%, -50%) scale(1.16); opacity: 1; }
    }

    /* ==========================================================================
       3. HTML5 캔버스 (별빛, 폭죽, 컨페티, 충격파 링)
       ========================================================================== */
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    /* ==========================================================================
       4. 초화려 3D 레이어드 "퇴근!!" 타이포그래피
       ========================================================================== */
    .hero-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      /* 3D 원근감 */
      perspective: 900px;
    }

    /* 상단 네온 배지 */
    .top-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 1.2rem;
      margin-bottom: clamp(0.8rem, 2.5vh, 1.6rem);
      border-radius: 9999px;
      background: rgba(20, 10, 45, 0.75);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      box-shadow:
        0 0 15px rgba(255, 215, 0, 0.5),
        inset 0 0 12px rgba(255, 0, 170, 0.4);
      color: #ffe875;
      font-weight: 900;
      font-size: clamp(0.8rem, 2.2vw, 1.05rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: badgeFloat 2.2s ease-in-out infinite alternate;
    }

    @keyframes badgeFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    /* 3D 텍스트 스택 컨테이너 */
    .title-3d-stage {
      position: relative;
      display: inline-block;
      transform-style: preserve-3d;
      animation: heroBouncePulse 2.6s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 클릭/터치 시 텍스트가 순간적으로 팡! 튀어오르는 클래스 */
    .title-3d-stage.pop-boost {
      animation: popExplosion 0.55s cubic-bezier(0.22, 1.65, 0.36, 1) forwards;
    }

    @keyframes heroBouncePulse {
      0%, 100% {
        transform: scale(1) rotate(-2deg) translateY(0);
      }
      25% {
        transform: scale(1.05) rotate(1.5deg) translateY(-10px);
      }
      50% {
        transform: scale(0.98) rotate(-1deg) translateY(3px);
      }
      75% {
        transform: scale(1.06) rotate(2deg) translateY(-8px);
      }
    }

    @keyframes popExplosion {
      0% { transform: scale(0.85) rotate(-4deg); }
      45% { transform: scale(1.22) rotate(3deg); }
      75% { transform: scale(0.96) rotate(-1.5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* 모든 3D 레이어 공통 타이포그래피 스타일 */
    .mega-text {
      font-family: 'Black Han Sans', sans-serif;
      font-size: clamp(4.2rem, 17.5vw, 14.5rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      white-space: nowrap;
      display: block;
    }

    /* 뒷면 3D 압출(Extrude) 골드 & 네온 레이어들 */
    .mega-text-extrude {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: transparent;
      -webkit-text-stroke: clamp(3px, 0.6vw, 8px) #2a0845;
      text-shadow:
        0 2px 0 #ffd700,
        0 4px 0 #ffae00,
        0 6px 0 #ff6a00,
        0 8px 0 #ff007f,
        0 10px 0 #b800e6,
        0 12px 0 #5900b3,
        0 14px 0 #26004d,
        0 18px 25px rgba(0, 0, 0, 0.95),
        0 0 35px rgba(255, 0, 170, 0.85),
        0 0 70px rgba(0, 240, 255, 0.75);
      z-index: 1;
    }

    /* 외곽 네온 림 라이트 레이어 */
    .mega-text-outline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      color: transparent;
      -webkit-text-stroke: clamp(2px, 0.35vw, 5px) #ffffff;
      filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px #ff00de);
      opacity: 0.85;
      z-index: 2;
    }

    /* 최상단 메탈릭 골드 + 네온 레인보우 그라데이션 레이어 */
    .mega-text-front {
      position: relative;
      z-index: 3;
      background: linear-gradient(
        115deg,
        #fff7ad 0%,
        #ffd700 14%,
        #ff6ec7 28%,
        #00f5ff 44%,
        #ffffff 50%,
        #ffe600 56%,
        #ff2a85 72%,
        #7b2cbf 86%,
        #fff7ad 100%
      );
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: holographicShift 3.2s linear infinite;
      filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.65));
    }

    @keyframes holographicShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 텍스트 위를 가로지르는 반짝이는 스파클 핀 */
    .sparkle-star {
      position: absolute;
      width: clamp(24px, 4vw, 48px);
      height: clamp(24px, 4vw, 48px);
      pointer-events: none;
      z-index: 5;
      animation: starTwinkle 1.6s ease-in-out infinite alternate;
    }

    .sparkle-1 { top: -8%; left: 4%; animation-delay: 0s; }
    .sparkle-2 { top: 10%; right: 2%; animation-delay: 0.5s; }
    .sparkle-3 { bottom: 4%; left: 26%; animation-delay: 1s; }
    .sparkle-4 { top: -12%; right: 22%; animation-delay: 0.8s; }

    @keyframes starTwinkle {
      0% { transform: scale(0.35) rotate(0deg); opacity: 0.3; }
      100% { transform: scale(1.25) rotate(90deg); opacity: 1; }
    }

    /* ==========================================================================
       5. 하단 인터랙션 안내 & 효과음 컨트롤 바
       ========================================================================== */
    .bottom-hud {
      position: fixed;
      bottom: clamp(16px, 4vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 1.1rem;
      border-radius: 9999px;
      background: rgba(12, 6, 30, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.25);
      white-space: nowrap;
    }

    .hud-hint {
      color: #f3e8ff;
      font-size: clamp(0.78rem, 2.2vw, 0.95rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .hud-hint span {
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.8);
    }

    .btn-action {
      border: none;
      border-radius: 9999px;
      padding: 0.42rem 0.9rem;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 900;
      font-size: clamp(0.75rem, 2vw, 0.88rem);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-boom {
      background: linear-gradient(135deg, #ffd700 0%, #ff0080 100%);
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 14px rgba(255, 0, 128, 0.6);
    }

    .btn-boom:hover {
      transform: scale(1.06);
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.9);
    }

    .btn-boom:active {
      transform: scale(0.95);
    }

    .btn-sound {
      background: rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-sound:hover {
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="퇴근 축하 무대">
    <!-- 원근 사이버 그리드 -->
    <div class="cyber-grid"></div>

    <!-- 회전하는 선버스트 후광 -->
    <div class="sunburst-wrapper">
      <div class="sunburst"></div>
    </div>

    <!-- 중앙 네온 글로우 -->
    <div class="center-aura"></div>

    <!-- 메인 3D 타이포그래피 영역 -->
    <section class="hero-wrapper">
      <div class="top-badge">⚡ 18:00 MISSION COMPLETE ⚡</div>

      <div id="title-stage" class="title-3d-stage">
        <!-- 반짝이 4방향 SVG -->
        <svg class="sparkle-star sparkle-1" viewBox="0 0 64 64" fill="none">
          <path d="M32 0L37 27L64 32L37 37L32 64L27 37L0 32L27 27L32 0Z" fill="#FFF7AD" />
        </svg>
        <svg class="sparkle-star sparkle-2" viewBox="0 0 64 64" fill="none">
          <path d="M32 0L37 27L64 32L37 37L32 64L27 37L0 32L27 27L32 0Z" fill="#00F5FF" />
        </svg>
        <svg class="sparkle-star sparkle-3" viewBox="0 0 64 64" fill="none">
          <path d="M32 0L37 27L64 32L37 37L32 64L27 37L0 32L27 27L32 0Z" fill="#FF6EC7" />
        </svg>
        <svg class="sparkle-star sparkle-4" viewBox="0 0 64 64" fill="none">
          <path d="M32 0L37 27L64 32L37 37L32 64L27 37L0 32L27 27L32 0Z" fill="#FFD700" />
        </svg>

        <!-- 3D 입체 압출 레이어 -->
        <span class="mega-text mega-text-extrude" aria-hidden="true">퇴근!!</span>
        <!-- 네온 화이트 윤곽선 레이어 -->
        <span class="mega-text mega-text-outline" aria-hidden="true">퇴근!!</span>
        <!-- 최상단 홀로그램 골드 & 레인보우 텍스트 -->
        <h1 class="mega-text mega-text-front">퇴근!!</h1>
      </div>
    </section>

    <!-- 폭죽 & 파티클 렌더링 캔버스 -->
    <canvas id="fx-canvas"></canvas>
  </main>

  <!-- 하단 플로팅 컨트롤 HUD -->
  <div class="bottom-hud" id="hud-bar">
    <span class="hud-hint">화면을 <span>클릭</span>하면 퇴근 축포 발사!</span>
    <button type="button" id="btn-mega-boom" class="btn-action btn-boom">🎉 대폭발!</button>
    <button type="button" id="btn-sound-toggle" class="btn-action btn-sound" aria-pressed="true">🔊 효과음 ON</button>
  </div>

  <script>
    /**
     * ============================================================================
     * 초화려 "퇴근!!" 인터랙티브 파티클, 폭죽, 충격파 및 신디사이저 사운드 엔진
     * ============================================================================
     */
    (function () {
      const stage = document.getElementById('stage');
      const titleStage = document.getElementById('title-stage');
      const canvas = document.getElementById('fx-canvas');
      const ctx = canvas.getContext('2d');
      const btnMegaBoom = document.getElementById('btn-mega-boom');
      const btnSoundToggle = document.getElementById('btn-sound-toggle');
      const hudBar = document.getElementById('hud-bar');

      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // 파티클 저장 배열
      const stars = [];
      const particles = [];
      const shockwaves = [];
      const confetti = [];

      // 화려한 네온 & 골드 컬러 팔레트
      const PALETTE = [
        '#FFD700', // 메탈릭 골드
        '#FFF275', // 라이트 골드
        '#FF007F', // 네온 마젠타
        '#FF2A85', // 핫 핑크
        '#00F5FF', // 일렉트릭 시안
        '#7B2CBF', // 사이버 퍼플
        '#39FF14', // 네온 라임
        '#FF9E00', // 선셋 오렌지
        '#FFFFFF'  // 퓨어 화이트 스파클
      ];

      // ==========================================================================
      // 1. Web Audio API 기반 경쾌한 축하 팡파르 / 폭죽 신디사이저 (외부 파일 불필요)
      // ==========================================================================
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      /**
       * 클릭/폭발 시 경쾌한 아르페지오 벨 + 폭죽 팝 사운드 재생
       */
      function playCelebrationSound(isMega = false) {
        if (!soundEnabled) return;
        try {
          initAudio();
          if (!audioCtx) return;

          const now = audioCtx.currentTime;
          // 메이저 펜타토닉 상승 아르페지오 주파수 (C5, E5, G5, B5, C6, E6)
          const notes = isMega
            ? [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51, 1567.98]
            : [523.25, 659.25, 783.99, 1046.50];

          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
            const startTime = now + idx * 0.045;
            osc.frequency.setValueAtTime(freq, startTime);
            osc.frequency.exponentialRampToValueAtTime(freq * 1.02, startTime + 0.25);

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.linearRampToValueAtTime(isMega ? 0.13 : 0.09, startTime + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.38);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(startTime);
            osc.stop(startTime + 0.4);
          });

          // 폭죽 저음 펀치(Pop)
          const popOsc = audioCtx.createOscillator();
          const popGain = audioCtx.createGain();
          popOsc.type = 'sine';
          popOsc.frequency.setValueAtTime(160, now);
          popOsc.frequency.exponentialRampToValueAtTime(38, now + 0.18);

          popGain.gain.setValueAtTime(isMega ? 0.28 : 0.18, now);
          popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

          popOsc.connect(popGain);
          popGain.connect(audioCtx.destination);
          popOsc.start(now);
          popOsc.stop(now + 0.22);
        } catch (err) {
          // 오디오 정책 제한 시 조용히 무시
        }
      }

      // ==========================================================================
      // 2. 반응형 캔버스 크기 조정 및 배경 별빛 초기화
      // ==========================================================================
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // 별빛 재생성
        stars.length = 0;
        const starCount = Math.min(Math.floor((width * height) / 8500), 160);
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 1.8 + 0.4,
            alpha: Math.random(),
            delta: (Math.random() * 0.025 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)]
          });
        }
      }

      // ==========================================================================
      // 3. 폭죽, 충격파 링, 종이꽃가루(Confetti) 생성 함수
      // ==========================================================================
      function spawnShockwave(x, y, maxRadius = 220, color = '#FFD700') {
        shockwaves.push({
          x,
          y,
          radius: 8,
          maxRadius,
          lineWidth: 6,
          alpha: 1,
          color
        });
      }

      function spawnFirework(x, y, count = 56, power = 1) {
        const baseColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
        const secondColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];

        // 이중 충격파 생성
        spawnShockwave(x, y, 160 * power, baseColor);
        spawnShockwave(x, y, 100 * power, '#FFFFFF');

        // 불꽃 입자 생성
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.25;
          const speed = (Math.random() * 6.5 + 2.2) * power;
          const color = i % 3 === 0 ? '#FFFFFF' : (i % 2 === 0 ? baseColor : secondColor);

          particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            gravity: 0.11,
            friction: 0.965,
            size: Math.random() * 3.4 + 1.6,
            alpha: 1,
            decay: Math.random() * 0.018 + 0.012,
            color,
            trail: []
          });
        }

        // 반짝이는 황금/네온 컨페티(종이조각) 추가
        const confettiCount = Math.floor(count * 0.45);
        for (let i = 0; i < confettiCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 5.5 + 1.8) * power;
          confetti.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 2.2,
            w: Math.random() * 9 + 5,
            h: Math.random() * 5 + 3,
            rotation: Math.random() * 360,
            vRot: (Math.random() - 0.5) * 14,
            wobble: Math.random() * 10,
            color: PALETTE[Math.floor(Math.random() * PALETTE.length)],
            alpha: 1,
            decay: Math.random() * 0.008 + 0.005
          });
        }
      }

      /**
       * 화면 흔들림 + 텍스트 팝 애니메이션 트리거
       */
      function triggerVisualImpact() {
        stage.classList.remove('shake');
        void stage.offsetWidth; // 리플로우 강제 실행으로 애니메이션 재시작
        stage.classList.add('shake');

        titleStage.classList.remove('pop-boost');
        void titleStage.offsetWidth;
        titleStage.classList.add('pop-boost');
      }

      /**
       * 초대형 다중 연쇄 폭죽 쇼 ("대폭발!" 버튼 및 초기 오프닝용)
       */
      function triggerMegaCelebration() {
        triggerVisualImpact();
        playCelebrationSound(true);

        const bursts = 6;
        for (let i = 0; i < bursts; i++) {
          setTimeout(() => {
            const rx = width * (0.18 + Math.random() * 0.64);
            const ry = height * (0.18 + Math.random() * 0.58);
            spawnFirework(rx, ry, 72, 1.3);
          }, i * 110);
        }
      }

      // ==========================================================================
      // 4. 메인 애니메이션 루프 (60fps 렌더링)
      // ==========================================================================
      function animate() {
        ctx.clearRect(0, 0, width, height);

        // 1) 반짝이는 배경 별빛 그리기
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.alpha += s.delta;
          if (s.alpha >= 1) {
            s.alpha = 1;
            s.delta *= -1;
          } else if (s.alpha <= 0.15) {
            s.alpha = 0.15;
            s.delta *= -1;
          }

          ctx.save();
          ctx.globalAlpha = s.alpha;
          ctx.fillStyle = s.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = s.color;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 2) 네온 충격파(Shockwave) 링 그리기
        for (let i = shockwaves.length - 1; i >= 0; i--) {
          const sw = shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 0.12;
          sw.alpha -= 0.035;
          sw.lineWidth *= 0.95;

          if (sw.alpha <= 0.02) {
            shockwaves.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = sw.alpha;
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = Math.max(1, sw.lineWidth);
          ctx.shadowBlur = 18;
          ctx.shadowColor = sw.color;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 3) 폭죽 불꽃 꼬리(Trail) 및 입자 그리기
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.trail.push({ x: p.x, y: p.y });
          if (p.trail.length > 5) p.trail.shift();

          p.vx *= p.friction;
          p.vy = p.vy * p.friction + p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0.02) {
            particles.splice(i, 1);
            continue;
          }

          // 꼬리 선 렌더링
          if (p.trail.length > 1) {
            ctx.beginPath();
            ctx.moveTo(p.trail[0].x, p.trail[0].y);
            for (let t = 1; t < p.trail.length; t++) {
              ctx.lineTo(p.trail[t].x, p.trail[t].y);
            }
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = p.alpha * 0.45;
            ctx.lineWidth = p.size * 0.7;
            ctx.stroke();
          }

          // 중심 불꽃 헤드 렌더링
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 4) 팔랑거리는 종이꽃가루(Confetti) 그리기
        for (let i = confetti.length - 1; i >= 0; i--) {
          const c = confetti[i];
          c.wobble += 0.12;
          c.vx *= 0.98;
          c.vy += 0.085; // 부드러운 낙하
          c.x += c.vx + Math.sin(c.wobble) * 0.9;
          c.y += c.vy;
          c.rotation += c.vRot;
          c.alpha -= c.decay;

          if (c.alpha <= 0.02 || c.y > height + 30) {
            confetti.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = c.alpha;
          ctx.translate(c.x, c.y);
          ctx.rotate((c.rotation * Math.PI) / 180);
          ctx.fillStyle = c.color;
          ctx.shadowBlur = 6;
          ctx.shadowColor = c.color;
          ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
          ctx.restore();
        }

        requestAnimationFrame(animate);
      }

      // ==========================================================================
      // 5. 사용자 인터랙션 이벤트 바인딩 (클릭, 터치, 스페이스바, 자동 폭죽)
      // ==========================================================================
      function handleScreenBlast(clientX, clientY) {
        triggerVisualImpact();
        playCelebrationSound(false);
        spawnFirework(clientX, clientY, 64, 1.15);
      }

      stage.addEventListener('pointerdown', (e) => {
        // 하단 HUD 버튼 클릭은 중복 발사 방지
        if (hudBar.contains(e.target)) return;
        handleScreenBlast(e.clientX, e.clientY);
      });

      // '대폭발!' 버튼 클릭
      btnMegaBoom.addEventListener('click', (e) => {
        e.stopPropagation();
        triggerMegaCelebration();
      });

      // 효과음 ON/OFF 토글 버튼
      btnSoundToggle.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;
        btnSoundToggle.textContent = soundEnabled ? '🔊 효과음 ON' : '🔇 효과음 OFF';
        btnSoundToggle.setAttribute('aria-pressed', String(soundEnabled));
        if (soundEnabled) {
          playCelebrationSound(false);
        }
      });

      // 스페이스바 / 엔터 키 입력 시에도 축하 축포 발사
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'Enter') {
          e.preventDefault();
          triggerMegaCelebration();
        }
      });

      window.addEventListener('resize', resizeCanvas);

      // 주기적인 자동 배경 폭죽 (페이지가 항상 축제처럼 빛나도록 유지)
      setInterval(() => {
        if (document.hidden) return;
        const rx = width * (0.15 + Math.random() * 0.7);
        const ry = height * (0.15 + Math.random() * 0.55);
        spawnFirework(rx, ry, 44, 0.95);
      }, 1700);

      // 초기화 및 오프닝 연쇄 불꽃놀이 실행
      window.onload = function () {
        resizeCanvas();
        animate();

        // 첫 진입 시 화려한 오프닝 축포 (소리는 브라우저 정책상 첫 클릭부터 재생)
        setTimeout(() => {
          triggerVisualImpact();
          spawnFirework(width * 0.3, height * 0.35, 65, 1.2);
          spawnFirework(width * 0.7, height * 0.35, 65, 1.2);
        }, 250);
        setTimeout(() => {
          spawnFirework(width * 0.5, height * 0.28, 80, 1.35);
        }, 550);
      };
    })();
  </script>
</body>
</html>
